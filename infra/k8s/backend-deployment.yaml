apiVersion: apps/v1
kind: Deployment
metadata:
  name: rso-backend
  namespace: rockstar-organics
spec:
  replicas: 3
  selector:
    matchLabels:
      app: rso-backend
  template:
    metadata:
      labels:
        app: rso-backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/example-org/rockstar-organics-backend:latest  # built by .github/workflows/ci.yml
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: rso-config
            - secretRef:
                name: rso-backend-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /api/ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
          volumeMounts:
            - name: uploads
              mountPath: /app/uploads
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: rso-uploads-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: rso-backend
  namespace: rockstar-organics
spec:
  selector:
    app: rso-backend
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: rso-backend-hpa
  namespace: rockstar-organics
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: rso-backend
  minReplicas: 3
  maxReplicas: 12
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rso-uploads-pvc
  namespace: rockstar-organics
spec:
  accessModes: ["ReadWriteMany"]
  resources:
    requests:
      storage: 20Gi
  # NOTE: in a real cloud deployment, prefer S3/object storage for uploads
  # over a ReadWriteMany volume - see docs/PRODUCTION_CHECKLIST.md. This
  # PVC is a portable fallback for clusters without an S3-compatible option.
