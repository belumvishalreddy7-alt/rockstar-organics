# CI gate: pytest -> frontend typecheck/vitest/build -> Playwright e2e,
# always. The `build-and-push-images`/`deploy-production` jobs below target
# an AWS ECS deployment path (infra/terraform/) that this project is NOT
# currently using in production - the real deployment is Vercel (frontend)
# + Render (backend), which deploy via their own git integrations outside
# this workflow (see README.md "Deployment"). Those two jobs are harmless
# no-ops/failures as long as AWS_DEPLOY_ROLE_ARN etc. aren't configured as
# repository secrets, which they intentionally aren't for this project.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pytest
        run: pytest -v --junitxml=pytest-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-pytest-results
          path: backend/pytest-results.xml

  frontend-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc -b

      - name: Unit tests
        run: npx vitest run

      - name: Production build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

  e2e-tests:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-checks]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Apply migrations
        working-directory: backend
        run: alembic upgrade head
        env:
          DATABASE_URL: sqlite:///./rockstar_organics.db

      - name: Start backend
        working-directory: backend
        run: |
          nohup uvicorn app.main:app --host 0.0.0.0 --port 8000 > backend.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:8000/api/health && break || sleep 1; done
        env:
          ENVIRONMENT: test
          SECRET_KEY: ci-test-secret-key
          DEV_EXPOSE_RESET_TOKEN: "true"
          DEV_EXPOSE_OTP: "true"

      # Gives the e2e suite a known staff login (admin.demo@example.com) so
      # it can exercise admin-only flows (certificate verification, photo
      # approval, review moderation) - refuses to run outside
      # ENVIRONMENT=production, so this is a no-op risk in real deployments.
      - name: Seed demo accounts for e2e admin flows
        working-directory: backend
        run: python -m scripts.seed_demo_accounts
        env:
          ENVIRONMENT: test
          DATABASE_URL: sqlite:///./rockstar_organics.db

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build frontend
        run: npm run build

      - name: Serve frontend build
        run: npx vite preview --port 5173 &

      - name: Run Playwright smoke tests
        run: npx playwright test
        env:
          E2E_BASE_URL: http://localhost:5173

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report

  build-and-push-images:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-checks, e2e-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-backend:${{ github.sha }}
            ghcr.io/${{ github.repository }}-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-frontend:${{ github.sha }}
            ghcr.io/${{ github.repository }}-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  notify-sentry-release:
    runs-on: ubuntu-latest
    needs: [build-and-push-images]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Create Sentry release
        # No-ops gracefully if SENTRY_AUTH_TOKEN isn't configured yet - see
        # docs/PRODUCTION_CHECKLIST.md "Error tracking" for setup.
        if: ${{ env.SENTRY_AUTH_TOKEN != '' }}
        uses: getsentry/action-release@v1
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        with:
          environment: production
          version: ${{ github.sha }}

  # Deployment is intentionally a manual/approval-gated job rather than an
  # automatic step after build-and-push-images - promoting straight to
  # production on every main push is a choice a team should opt into
  # explicitly (e.g. by adding a required reviewer to the "production"
  # GitHub Environment below), not something CI decides unilaterally.
  deploy-production:
    runs-on: ubuntu-latest
    needs: [build-and-push-images]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Deploy backend service
        run: |
          aws ecs update-service \
            --cluster rockstar-organics-production \
            --service rockstar-organics-backend \
            --force-new-deployment
      - name: Deploy frontend service
        run: |
          aws ecs update-service \
            --cluster rockstar-organics-production \
            --service rockstar-organics-frontend \
            --force-new-deployment
      - name: Wait for backend service stability
        run: |
          aws ecs wait services-stable \
            --cluster rockstar-organics-production \
            --services rockstar-organics-backend
